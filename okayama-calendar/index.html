<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>イベントカレンダー｜岡山県ダンススポーツ連盟</title>
<!--
  ホームページの「イベントカレンダー」に表示するページ。
  サイト管理にはリンクしか貼れないので、このページを Cloudflare Pages に置いて、そのリンクを貼る。
  画面が広いとき（パソコン）は Google カレンダーの月の表、狭いとき（スマホ）は
  「11月25日（水）」の形の、自作の予定の一覧を出す（予定は _worker.js が Google から読み込む）。
-->
<style>
  :root { --primary: #4B6CB7; --primary-dark: #2E4A8E; --text: #0F172A; --muted: #6B7280; --line: #E2E8F0; --bg-blue: #EEF2FF; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; color: var(--text); }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .list, .list-fallback { display: none; }
  @media (max-width: 640px) {
    .month { display: none; }
    .list { display: block; }
    body.fallback .list { display: none; }
    body.fallback .list-fallback { display: block; }
  }

  /* スマホ用の予定の一覧 */
  .list { background: #fff; }
  .day { border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .day-head { font-weight: 800; color: var(--primary-dark); font-size: 15px; }
  .day-head .sun { color: #C2410C; }
  .day-head .sat { color: #1D4ED8; }
  .ev { margin: 6px 0 2px; }
  .ev summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .ev summary::-webkit-details-marker { display: none; }
  .ev-time { flex: 0 0 auto; font-size: 12px; color: #fff; background: var(--primary); border-radius: 100px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .ev-title { font-size: 15px; line-height: 1.45; }
  .ev-more { margin: 6px 0 4px; padding: 8px 10px; background: var(--bg-blue); border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev-more a { color: var(--primary-dark); font-weight: 700; }
  .ev-more .loc { font-weight: 700; }
  .ev[open] .ev-title { font-weight: 700; }
  /* 詳しい内容がある予定には、最初から「詳細はこちら」ボタンを出しておく */
  .ev-break { flex-basis: 100%; height: 0; }
  .ev-btn {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
    font-size: 12px; font-weight: 700; color: var(--primary-dark); background: var(--bg-blue);
    border: 1px solid #c7d2fe; border-radius: 100px; padding: 3px 12px;
  }
  .ev-btn .close, .ev[open] .ev-btn .open { display: none; }
  .ev[open] .ev-btn .close { display: inline; }
  .ev-plain { margin: 6px 0 2px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .msg { padding: 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <iframe class="month" title="イベントカレンダー（月の表）" loading="lazy"
    src="https://calendar.google.com/calendar/embed?src=9ebb3213869f1721c4e0b0e74ecd89fe9d4c0a080dbb4f4034b070fa78ce72e9%40group.calendar.google.com&amp;ctz=Asia%2FTokyo&amp;hl=ja&amp;wkst=1&amp;showTitle=0&amp;showPrint=0&amp;showCalendars=0&amp;showTz=0&amp;color=%234B6CB7&amp;mode=MONTH"></iframe>
  <div class="list" id="list"><div class="msg">予定を読み込んでいます…</div></div>
  <!-- 自作の一覧が読み込めなかったときだけ、Google の一覧を出す -->
  <iframe class="list-fallback" title="イベントカレンダー（予定の一覧）" loading="lazy"
    data-src="https://calendar.google.com/calendar/embed?src=9ebb3213869f1721c4e0b0e74ecd89fe9d4c0a080dbb4f4034b070fa78ce72e9%40group.calendar.google.com&amp;ctz=Asia%2FTokyo&amp;hl=ja&amp;wkst=1&amp;showTitle=0&amp;showPrint=0&amp;showCalendars=0&amp;showTz=0&amp;color=%234B6CB7&amp;mode=AGENDA&amp;showTabs=0"></iframe>

<script>
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const list = document.getElementById('list');

  // 「2027-01-24」→「1月24日（日）」。年が今年と違うときは年も付ける
  function formatDay(date, withYear) {
    const [y, m, d] = date.split('-').map(Number);
    const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    const cls = w === 0 ? 'sun' : w === 6 ? 'sat' : '';
    return (withYear ? y + '年' : '') + m + '月' + d + '日' + '<span class="' + cls + '">（' + WEEK[w] + '）</span>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 時間は出さない（予定はすべて終日で入れ、時間や場所は詳細で確かめてもらう。誤入力の心配も減る）。
  // 何日かにまたがる予定だけ、終わりの日を出す
  function timeLabel(e) {
    if (!e.endDate) return '';
    const [, m, d] = e.endDate.split('-').map(Number);
    return '〜' + m + '/' + d;
  }

  // 説明の中の住所（https://…）を、押せるリンクにする
  function linkify(text) {
    let out = '';
    let last = 0;
    for (const m of text.matchAll(/https?:\/\/[^\s<>"'）)」]+/g)) {
      out += esc(text.slice(last, m.index));
      out += '<a href="' + esc(m[0]) + '" target="_blank" rel="noopener noreferrer">' + esc(m[0]) + '</a>';
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function render(events) {
    if (!events.length) { list.innerHTML = '<div class="msg">これからの予定はまだありません</div>'; return; }
    const thisYear = new Date().getFullYear();
    const byDay = new Map();
    for (const e of events) {
      if (!byDay.has(e.date)) byDay.set(e.date, []);
      byDay.get(e.date).push(e);
    }
    let html = '';
    for (const [date, evs] of byDay) {
      html += '<div class="day"><div class="day-head">' + formatDay(date, Number(date.slice(0, 4)) !== thisYear) + '</div>';
      for (const e of evs) {
        const more = [e.location ? '<div class="loc">📍 ' + linkify(e.location) + '</div>' : '', e.description ? linkify(e.description) : ''].join('');
        const label = timeLabel(e);
        const head = (label ? '<span class="ev-time">' + esc(label) + '</span>' : '') + '<span class="ev-title">' + esc(e.title) + '</span>';
        // 詳しい内容がない予定は、押しても何も起きないので、ボタンを出さずにそのまま並べる
        html += more
          ? '<details class="ev"><summary>' + head
            + '<span class="ev-break"></span><span class="ev-btn"><span class="open">詳細はこちら ▼</span><span class="close">閉じる ▲</span></span>'
            + '</summary><div class="ev-more">' + more + '</div></details>'
          : '<div class="ev-plain">' + head + '</div>';
      }
      html += '</div>';
    }
    list.innerHTML = html;
  }

  function fallback() {
    const f = document.querySelector('.list-fallback');
    f.src = f.dataset.src;
    document.body.classList.add('fallback');
  }

  fetch('events.json')
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(d => d.events ? render(d.events) : fallback())
    .catch(fallback);
</script>
</body>
</html>
